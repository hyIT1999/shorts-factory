# nginx site for Shorts Factory: the Angular app as static files, the API proxied to 127.0.0.1:3000,
# everything behind HTTP Basic Auth (single user). Add TLS with `certbot --nginx` afterwards.
#
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-shorts <user>
#   sudo cp deploy/nginx-shorts-factory.conf /etc/nginx/sites-available/shorts-factory
#   sudo ln -s /etc/nginx/sites-available/shorts-factory /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name _;

    auth_basic "Shorts Factory";
    auth_basic_user_file /etc/nginx/.htpasswd-shorts;

    client_max_body_size 1m;

    # Uptime monitors may read the health check without credentials.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Rendered videos are streamed with Range requests; do not buffer them in nginx.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Angular build output (`npm run build:frontend`); adjust the project folder name if it differs.
    location / {
        root /opt/shorts-factory/frontend/dist/frontend/browser;
        try_files $uri $uri/ /index.html;
    }
}
